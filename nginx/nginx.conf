# Front door for the task API. Mounted read-only at /etc/nginx/nginx.conf.
#
# This proxies to a SINGLE backend. It is not load balancing across replicas and cannot be:
# the application stores state in one SQLite file on a bind mount, and SQLite takes one writer.
# See vault/specs/nginx-load-balancer.md before adding upstreams.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Combined, plus upstream timing -- so a slow response is attributable to the app or to
    # the proxy rather than being a guess.
    log_format  upstream_time  '$remote_addr - $remote_user [$time_local] "$request" '
                               '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                               'rt=$request_time uct="$upstream_connect_time" '
                               'urt="$upstream_response_time" ua="$upstream_addr"';

    # The nginx image symlinks these to stdout/stderr, so `make logs` is the single place to
    # look. Nothing is written to disk and there is no rotation to maintain.
    access_log  /var/log/nginx/access.log  upstream_time;
    error_log   /var/log/nginx/error.log   warn;

    sendfile      on;
    server_tokens off;

    # The app caps description at 2000 chars; 1 MB is already far above any legitimate request.
    client_max_body_size 1m;

    # Generous on purpose: this does not restrict local use, but the mechanism is live and
    # tested, so tightening it later is a single number rather than a new feature.
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

    # Docker's embedded DNS. `valid=10s` re-resolves instead of caching a dead IP forever.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        server_name _;

        # Nginx's own liveness, deliberately public on the same port: one curl then tells you
        # which layer is down. It does NOT touch the backend -- this answers "is the proxy up",
        # the app's /health answers "is the app up". Conflating them makes a backend restart
        # look like a proxy failure.
        location = /nginx-health {
            access_log off;
            add_header Content-Type application/json always;
            return 200 '{"status":"UP","service":"nginx"}';
        }

        # The browser MCP client. A LONGER prefix than /mcp below, so nginx matches this first
        # -- measured, see vault/specs/mcp-client.md. `^~` states that rather than relying on the
        # reader knowing the longest-match rule, and stops a regex location added later from
        # taking it.
        #
        # `root`, not `alias`. With alias, `try_files` resolves against the URI rather than the
        # aliased path and the fallback silently 404s; the mount point therefore mirrors the URL
        # (/usr/share/nginx/html/mcp/client) and root needs no such trick.
        #
        # The files come from a bind mount of mcp-client/dist, so `make build` must have run.
        # A missing build shows up as a 404 here, not as a container that fails to start.
        location ^~ /mcp/client {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /mcp/client/index.html;

            # Without this, nginx's directory redirect for /mcp/client (no trailing slash) builds
            # an ABSOLUTE Location from its own listen port -- so `PORT=9000 make up` sent the
            # browser to http://localhost:8080/mcp/client/ and nothing was there. Verified, both
            # the bug and the fix. Relative redirects resolve against whatever origin the browser
            # is already on, which is the only port that is known to work.
            absolute_redirect off;

            # The bundle is rebuilt in place by `make build-client` and the page is a debugging
            # tool, so a cached copy is worse than a re-fetch.
            add_header Cache-Control "no-store" always;
        }

        # The MCP server, also reachable on its own port 8877 below. nginx picks prefix
        # locations by LONGEST match, not by file order, so this wins over `location /` for
        # /mcp wherever it sits. (Order only decides between regex locations.)
        #
        # Consequence: /mcp is now a reserved path on 8080. The task API must never grow an
        # endpoint there.
        location /mcp {
            limit_req zone=api burst=200 nodelay;

            set $upstream_mcp_8080 http://mcp:8877;
            proxy_pass $upstream_mcp_8080;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        location / {
            limit_req zone=api burst=200 nodelay;

            # proxy_pass through a VARIABLE, not a literal. With a literal hostname nginx
            # resolves once at startup and caches the result forever -- a restarted api
            # container comes back on a new IP and every request 502s until nginx is reloaded.
            # A variable forces resolution at request time, using the resolver above.
            set $upstream_api http://api:8080;
            proxy_pass $upstream_api;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }
    }

    # Dedicated MCP listener. Same backend as /mcp on 8080 -- two entrances, one service.
    server {
        listen 8877;
        server_name _;

        location = /nginx-health {
            access_log off;
            add_header Content-Type application/json always;
            return 200 '{"status":"UP","service":"nginx-mcp"}';
        }

        location / {
            limit_req zone=api burst=200 nodelay;

            # Variable plus resolver, same as the 8080 block. Here it does double duty: it is
            # also what lets nginx see MCP replicas that did not exist when it started, which
            # is what makes `make scale` work without a reload.
            set $upstream_mcp http://mcp:8877;
            proxy_pass $upstream_mcp;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            # Longer than the api block: a tool call is an api call plus overhead, and MCP
            # clients tolerate latency better than truncation.
            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }
    }
}
