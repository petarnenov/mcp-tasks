micronaut:
  application:
    name: tasks-mcp
  server:
    port: 8877

  mcp:
    server:
      # The Transport enum offers exactly HTTP and STDIO. HTTP is required here: stdio cannot be
      # load balanced, and this service runs behind nginx.
      transport: HTTP
      # The SDK's default, stated explicitly so it is greppable.
      endpoint: /mcp
      info:
        name: tasks
        version: 0.1.0

# Overridden by TASKS_API_URL in compose. The MCP server holds no state of its own -- everything
# lives behind this URL, which is why this service can be scaled and the task API cannot.
tasks:
  api:
    url: http://localhost:8080
