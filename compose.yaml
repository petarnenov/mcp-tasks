# No `version:` key — it is obsolete under the Compose Spec and current Compose warns about it.

services:
  api:
    build:
      context: .
      dockerfile: task-api/Dockerfile
    image: ${IMAGE:-tasks}:${TAG:-latest}
    # A fixed name also makes `--scale api=2` fail outright. That is deliberate: the app stores
    # state in one SQLite file and SQLite takes one writer, so two replicas is data corruption,
    # not extra throughput. Removing this line requires solving storage first.
    container_name: tasks-api
    # No published host port. The service is reachable only through nginx, on the compose
    # network. `expose` is documentation — compose networking does not require it.
    expose:
      - "8080"
    environment:
      # Absolute path inside the container; the bind mount below puts it on the host at ./data.
      DATASOURCES_DEFAULT_URL: jdbc:sqlite:/data/tasks.db
    volumes:
      # Bind mount rather than a named volume, so the database stays openable from the host
      # with `sqlite3 data/tasks.db`.
      - ./data:/data
    healthcheck:
      # curl is present in the pinned eclipse-temurin JRE image (verified 2026-08-23, 8.18.0).
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    # Deliberately no `restart:` policy. This is a tool the user starts on purpose; it should
    # not come back to life on every Docker daemon start.

  mcp:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    image: ${MCP_IMAGE:-tasks-mcp}:${TAG:-latest}
    # NO container_name, deliberately -- a fixed name is what makes `--scale` impossible, which
    # is the point on the api service and would be a bug here. This server holds no state, so
    # any replica can serve any request.
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8877"
    environment:
      TASKS_API_URL: http://api:8080
    healthcheck:
      # No curl in this image, and none is installed: node:24-alpine ships a runtime that can
      # make the request itself. `fetch(...).then(r => process.exit(r.ok ? 0 : 1))` is a real
      # HTTP probe against /health -- a TCP-only check would pass on a process that had stopped
      # answering, which is exactly what /health exists to catch.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8877/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      # Node starts in well under a second; the JVM this replaced needed 20.
      start_period: 5s

  nginx:
    # Pinned by digest, matching the decision made for the Temurin images.
    #   nginx:alpine -> nginx 1.31.4 on Alpine 3.24 (resolved 2026-08-23)
    # Re-resolve with: docker buildx imagetools inspect nginx:alpine
    image: nginx:alpine@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913
    container_name: tasks-nginx
    depends_on:
      api:
        # Without this nginx comes up first and the first requests 502 while the JVM boots.
        condition: service_healthy
      mcp:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
      - "${MCP_PORT:-8877}:8877"
    volumes:
      # Read-only, and a file in version control rather than baked into an image: editing it
      # needs `make nginx-reload`, not a rebuild.
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # The browser MCP client, served at /mcp/client. Same reasoning as nginx.conf above: a bind
      # mount rather than a custom nginx image, so a UI change is a bundle rebuild and a refresh
      # instead of a `docker build`, and this stays the digest-pinned official image.
      #
      # The mount point mirrors the URL, which is what lets the location use `root` instead of
      # `alias` -- see nginx.conf. `make up` therefore depends on `build-client`: without it this
      # directory does not exist and the page 404s.
      - ./mcp-client/dist:/usr/share/nginx/html/mcp/client:ro
    healthcheck:
      # Probes nginx's own endpoint, never the backend — a stopped api must not make the proxy
      # look broken. curl is a real binary in this image (verified 2026-08-23, 8.21.0).
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
